[project]
name = "cbbot"
version = "0.1.0"
description = "Coinbase trading + signals MCP server for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "coinbase-advanced-py>=1.8",
    "mcp>=1.2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
cbbot = "cbbot.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
